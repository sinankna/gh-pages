<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinan Kara | Android Developer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .highlight {
      color: #3ddc84; /* Android green */
    }

    p {
      color: #cbd5e1;
      font-size: 1.1rem;
      margin: 15px 0;
      line-height: 1.6;
    }

    .buttons {
      margin-top: 30px;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      color: white;
      border: 1px solid #334155;
      padding: 12px 20px;
      margin: 5px;
      border-radius: 8px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #3ddc84;
      color: #0f172a;
    }

    footer {
      margin-top: 40px;
      color: #64748b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Hi, I'm <span class="highlight">Sinan</span></h1>

    <p>
      Android developer who spends most of my time convincing Kotlin, Gradle, and Android Studio to cooperate.
    </p>

    <div class="buttons">
      <a href="https://linkedin.com/in/sinankna" class="btn">LinkedIn</a>
    </div>

    <footer>
      © 2026
    </footer>
  </div>

</body>
</html>
